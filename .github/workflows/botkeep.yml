name: Build Botkeep deployment branch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: botkeep-deploy
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install and build
        run: |
          npm ci
          npm run build
          npm run runner:setup
      - name: Verify application
        env:
          BYTEPATH_AI: "off"
        run: npm test
      - name: Publish source plus prebuilt frontend
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B botkeep-deploy
          git add -f dist
          git commit -m 'Build frontend for Botkeep deployment'
          git push origin HEAD:botkeep-deploy --force-with-lease
